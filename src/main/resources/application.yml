server:
  port: ${PORT:8090}
  servlet:
    context-path: /api/v1

spring:
  mail:
    host:     ${SMTP_HOST:smtp.gmail.com}
    port:     ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        connectiontimeout: 5000
        timeout: 5000
  datasource:
    url: ${NEXUS_DB_URL:jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${NEXUS_DB_USERNAME:postgres.qlmumipyikwifbcvzsfx}
    password: ${NEXUS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      keepalive-time: 120000
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    placeholder-replacement: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

supabase:
  url:              ${SUPABASE_URL}
  jwt-secret:       ${SUPABASE_JWT_SECRET}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY}

nexus:
  app-url: ${NEXUS_APP_URL:https://zevra-ui.vercel.app}
  cors:
    allowed-origins: ${NEXUS_CORS_ALLOWED_ORIGINS:*}
  storage:
    local-path: ${NEXUS_STORAGE_PATH:./data/documents}
  memory:
    embedding-dimensions: 1536
    chunk-target-words: 850
    chunk-overlap-words: 100
    retrieval-top-k: 6
  openai:
    api-key: ${OPENAI_API_KEY}
    chat-model: ${OPENAI_CHAT_MODEL:gpt-4o}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-ada-002}
    # Model tiering (pre-production cost optimization): low-complexity, structured-extraction
    # calls run on a cheaper model than the core Agent Brain reasoning path (chat-model above),
    # which stays on gpt-4o. Each has its own property so one candidate can be tuned/reverted
    # independently of the others — see AzureOpenAiClient's chatForTermExtraction /
    # chatForCorrectionDetection / chatWithJsonForOnboarding / respondForMemorySelection.
    term-extractor-model: ${OPENAI_TERM_EXTRACTOR_MODEL:gpt-4o-mini}
    # Live evaluation found gpt-4o-mini unsuitable here (misclassified plain follow-ups as
    # corrections) — kept on gpt-4o; see AzureOpenAiClient's correctionDetectorModel comment.
    correction-detector-model: ${OPENAI_CORRECTION_DETECTOR_MODEL:gpt-4o}
    onboarding-model: ${OPENAI_ONBOARDING_MODEL:gpt-4o-mini}
    memory-selection-model: ${OPENAI_MEMORY_SELECTION_MODEL:gpt-4o-mini}
    # Phase 3 controlled core model migration: Planner/Evaluator/Composer moved to gpt-4.1 after
    # Phase 2's live evaluation found it an acceptable candidate for these three workloads (8/8,
    # 3/3, and 4/4 contract-correct respectively). Stage 1 deliberately stays on chat-model
    # (gpt-4o) above — Phase 2 found gpt-4.1 unusable there (File Search never invoked, 0/3).
    planner-model: ${OPENAI_PLANNER_MODEL:gpt-4.1}
    evaluator-model: ${OPENAI_EVALUATOR_MODEL:gpt-4.1}
    composer-model: ${OPENAI_COMPOSER_MODEL:gpt-4.1}
  security:
    jwt-secret: ${NEXUS_JWT_SECRET:change-me-in-production}
    session-expiry-hours: 24
  context:
    max-entity-chars: 1500    # max chars of TABLE SCHEMA context per LLM call (~375 tokens)

  query-governance:
    sync-timeout-seconds: 30
    async-timeout-seconds: 90
    point-lookup-timeout-seconds: 10
    max-sync-rows: 500
    max-sync-cost: 500
    max-async-rows: 10000
    max-async-cost: 10000
    max-joins: 4
    max-selected-columns: 30
    default-row-limit: 100
    max-row-limit: 500
  retention:
    conversation-days: 3
    audit-log-days: 90       # delete audit_event rows older than this; 0 = keep forever
  alerts:
    app-url: ${NEXUS_APP_URL:https://zevra-ui.vercel.app}


